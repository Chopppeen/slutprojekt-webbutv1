<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

</head>
<body>
     <div class="page-shell">
        <aside class="sidebar">
            <h2>Watchlist</h2>
            <h3>Crypto</h3>
            <ul>
                <li class="watchlist-item"><a href="#" onclick="loadChart('BTC', 'crypto.html')">BTC <span id="price-btc"></span></a></li>
                <li class="watchlist-item"><a href="#" onclick="loadChart('SOL', 'crypto.html')">SOL <span id="price-sol"></span></a></li>
                <li class="watchlist-item"><a href="#" onclick="loadChart('ETH', 'crypto.html')">ETH <span id="price-eth"></span></a></li>
            </ul>

            <h3>Stocks</h3>

            <ul>
                <li class="watchlist-item"><a href="#" onclick="loadChart('AAPL', 'stock.html')">AAPL <span id="price-aapl"></span></a></li>
                <li class="watchlist-item"><a href="#" onclick="loadChart('GOOGL', 'stock.html')">GOOGL <span id="price-googl"></span></a></li>
                <li class="watchlist-item"><a href="#" onclick="loadChart('MSFT', 'stock.html')">MSFT <span id="price-msft"></span></a></li>
            </ul>
        </aside>
        <div class="right-area">
             <section class="navbar">
                 <nav>
                    <p class="logo"><a href="index.html">
                        Paper
                    </a></p>
                    <div class="nav-controls">
                        <span id="cash">$10,000.00</span>
                        <button class="profil-knapp" onclick="window.location='profil.html'"><img src="img/pfp-placeholder.png" alt="Profil"></button>
                    </div>
                 </nav>
             </section>
             <div class="right-body">
                 <section class="chart">
                    <h2 id="chart-title">Chart crypto</h2>
                    <div id="chart-container" style="width: 100%; height: 300px;"></div>
                    

                 </section>
                 <aside class="trade-sidebar">
                    <h2>Trade</h2>
                    <input class="value-bar" id="shares-input" type="number" min="1" value="1">
                    <button class="buy-btn" id="buy-btn">Buy</button>
                    <button class="sell-btn" id="sell-btn">Sell</button>

                 </aside>
             </div>
         </div>
     </div>
</body>
</html>
