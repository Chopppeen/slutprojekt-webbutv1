<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in — Paper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <p class="logo">Paper</p>
        <h2>Logga in</h2>

        <div class="auth-form">
            <input class="value-bar" id="login-email" type="email" placeholder="Email">
            <input class="value-bar" id="login-password" type="password" placeholder="Lösenord">
            <div id="login-error" class="trade-message error"></div>
            <button class="buy-btn" id="login-btn">Logga in</button>
            <p class="auth-link">Inget konto? <a href="register.html">Registrera dig</a></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
