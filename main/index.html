<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.js">

</head>
<body>
     <div class="page-shell">
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>buh.</p>
        </aside>
        <div class="right-area">
             <section class="navbar">
                 <nav>
                    <p class="logo">
                        Paper
                    </p>
                    <div class="nav-controls">
                        <span id="cash"> ${cash}</span>
                        <button class="profil-knapp" onclick="window.location='profil.html'"><img src="img/pfp-placeholder.png" alt="Profil"></button>
                    </div>
                 </nav>
             </section>
             <div class="right-body">
                 <section class="chart">
                    <h2>Chart crypto</h2>
                    <p>Här sätter vi API för BTC och SOL.</p>
                 </section>
                 <aside class="trade-sidebar">
                    <h2>Trade</h2>
                    <input class="value-bar" id="shares-input" type="number" min="1" value="1">
                    <button class="buy-btn" id="buy-btn">Buy</button>
                    <button class="sell-btn" id="sell-btn">Sell</button>

                 </aside>
             </div>
         </div>
     </div>
</body>
</html>
