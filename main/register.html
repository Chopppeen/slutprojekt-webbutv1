<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <p class="logo">Paper</p>
        <h2>Skapa konto</h2>

        <div class="auth-form">
            <input class="value-bar" id="reg-namn" type="text" placeholder="Namn">
            <input class="value-bar" id="reg-email" type="email" placeholder="Email">
            <input class="value-bar" id="reg-password" type="password" placeholder="Lösenord">
            <div id="reg-error" class="trade-message error"></div>
            <div id="reg-success" class="trade-message success"></div>
            <button class="buy-btn" id="reg-btn">Skapa konto</button>
            <p class="auth-link">Har du redan ett konto? <a href="login.html">Logga in</a></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
